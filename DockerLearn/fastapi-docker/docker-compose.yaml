version: '1.0'

services:
  mongodb:
    image: mongo
    ports:
      - 8080:8080
    environment:
      - MONGO_INIT_DB_ROOT=admin
      - MONGO_INIT_DB_PASSWORD=password
  
  mongo-express:
    image: mongo-express
    ports:
      - 8081:8081
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password
      - ME_CONFIG_MONGODB_ADMINSERVER=server